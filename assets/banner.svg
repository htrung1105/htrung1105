<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Nguyễn Lê Hoàng Trung. AI Engineer and AI Researcher. Retrieval systems, from the index to the API.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#0f3050"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .edge { stroke: #2c4a68; stroke-width: 1.5; }
    .node { fill: #16324e; stroke: #3b6288; stroke-width: 1.5; }
    .hop { fill: none; stroke: #5fb3f0; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 14 10; animation: flow 2.4s linear infinite; }
    .hit { fill: #5fb3f0; }
    .chip { fill: #14304b; stroke: #2f5478; }
    .chiptext { fill: #bcd4ea; font-size: 17px; font-weight: 600; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @media (prefers-reduced-motion: reduce) { .hop { animation: none; } }
  </style>
  <rect width="1280" height="320" rx="14" fill="url(#bg)"/>

  <g>
    <line class="edge" x1="850" y1="80" x2="960" y2="60"/>
    <line class="edge" x1="850" y1="80" x2="820" y2="190"/>
    <line class="edge" x1="960" y1="60" x2="1060" y2="110"/>
    <line class="edge" x1="960" y1="60" x2="930" y2="160"/>
    <line class="edge" x1="820" y1="190" x2="930" y2="160"/>
    <line class="edge" x1="820" y1="190" x2="880" y2="265"/>
    <line class="edge" x1="930" y1="160" x2="1060" y2="110"/>
    <line class="edge" x1="930" y1="160" x2="1000" y2="250"/>
    <line class="edge" x1="880" y1="265" x2="1000" y2="250"/>
    <line class="edge" x1="1060" y1="110" x2="1180" y2="80"/>
    <line class="edge" x1="1060" y1="110" x2="1140" y2="200"/>
    <line class="edge" x1="1000" y1="250" x2="1140" y2="200"/>
    <line class="edge" x1="1180" y1="80" x2="1140" y2="200"/>
    <line class="edge" x1="1140" y1="200" x2="1215" y2="265"/>
    <polyline class="hop" points="820,190 930,160 1060,110 1140,200"/>
    <circle class="node" cx="850" cy="80" r="11"/>
    <circle class="node" cx="960" cy="60" r="14"/>
    <circle class="node" cx="880" cy="265" r="10"/>
    <circle class="node" cx="1000" cy="250" r="13"/>
    <circle class="node" cx="1180" cy="80" r="12"/>
    <circle class="node" cx="1215" cy="265" r="9"/>
    <circle class="hit" cx="820" cy="190" r="14"/>
    <circle class="hit" cx="930" cy="160" r="12"/>
    <circle class="hit" cx="1060" cy="110" r="15"/>
    <circle class="hit" cx="1140" cy="200" r="16"/>
  </g>

  <text x="64" y="118" fill="#f2f6fb" font-size="56" font-weight="700">Nguyễn Lê Hoàng Trung</text>
  <text x="66" y="162" fill="#5fb3f0" font-size="25" font-weight="600">AI Engineer · AI Researcher</text>
  <text x="66" y="200" fill="#a9bdd1" font-size="21">Retrieval systems, from the index to the API.</text>

  <g transform="translate(66 232)">
    <rect class="chip" width="112" height="38" rx="19"/><text class="chiptext" x="56" y="25" text-anchor="middle">GraphRAG</text>
    <rect class="chip" x="124" width="210" height="38" rx="19"/><text class="chiptext" x="229" y="25" text-anchor="middle">Multimodal Retrieval</text>
    <rect class="chip" x="346" width="124" height="38" rx="19"/><text class="chiptext" x="408" y="25" text-anchor="middle">LLM Agents</text>
    <rect class="chip" x="482" width="72" height="38" rx="19"/><text class="chiptext" x="518" y="25" text-anchor="middle">OCR</text>
  </g>
</svg>
